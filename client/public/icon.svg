<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338CA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Clean Task Check Icon -->
  <g filter="url(#shadow)">
    <!-- Outer Checkbox outline -->
    <rect x="116" y="116" width="280" height="280" rx="64" fill="none" stroke="#FFFFFF" stroke-width="32" />
    <!-- Dynamic Checkmark -->
    <path d="M190 260 L240 310 L330 200" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
